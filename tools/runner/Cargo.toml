[package]
name = "cassiopeia-example-runner"
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "from", "from_str"] }
humantime = "2.4.0"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.5"
ureq = "3.4.1"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
