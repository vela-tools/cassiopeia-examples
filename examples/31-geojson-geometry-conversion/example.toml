[example]
title = "Converting GeoJSON geometry types for a GeoProperty"
label = "Geometry conversion"
summary = "Demote an administrative region's MultiPolygon to the largest Polygon and derive a map-pin centroid beside it."
formats = ["geojson"]
models = ["Region"]

[requirements]
smart-data-models = false

[run]
args = [
    "map",
    "--input",
    "data/regions.geojson",
    "--mapping",
    "region.json5",
    "--type",
    "geojson",
    "--output",
    "out",
    "--context",
    "none",
]

[[datasets]]
file = "data/regions.geojson"
url = "https://gisco-services.ec.europa.eu/distribution/v2/nuts/geojson/NUTS_RG_20M_2021_4326_LEVL_1.geojson"
source = "Eurostat GISCO"
# GISCO grants a non-exclusive right to use the data; commercial use needs a EuroGeographics
# licence, and the boundaries stay their copyright.
# https://ec.europa.eu/eurostat/web/gisco/geodata/statistical-units
license = "Free non-commercial reuse; administrative boundaries © EuroGeographics"
volatility = "frozen"
records = 125

[[outputs]]
file = "out/Region.json"
entities = 125
contains = ["urn:ngsi-ld:Region:MT0"]
