[example]
title = "Keeping variable GeoJSON objects in a JsonProperty"
label = "JsonProperty"
summary = "Keep an alert's changing parameters object in a JsonProperty."
formats = ["geojson"]
models = ["WeatherAlert"]

[requirements]
smart-data-models = false

[run]
args = [
    "map",
    "--input",
    "data/alerts.json",
    "--mapping",
    "alert.json5",
    "--type",
    "geojson",
    "--output",
    "out",
    "--context",
    "none",
]

[[datasets]]
file = "data/alerts.json"
url = "https://api.weather.gov/alerts/active"
source = "US National Weather Service"
# NWS information is in the public domain unless specifically noted otherwise.
# https://www.weather.gov/disclaimer
license = "Public domain (US Government)"
volatility = "live"
command = '''
curl -sS --fail --retry 3 --retry-delay 5 --retry-all-errors "https://api.weather.gov/alerts/active" \
    -H "User-Agent: cassiopeia-example" \
    -o data/alerts.json
'''

[[outputs]]
file = "out/WeatherAlert.json"
at-least = 114
