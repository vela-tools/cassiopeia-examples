[example]
title = "Adding a local `@context` to CSV entities"
label = "Local @context"
summary = "Define a JSON-LD context for an invented model, and materialise its host star as a second entity."
formats = ["csv"]
models = ["ExoPlanet", "Star"]

[requirements]
smart-data-models = false

[run]
args = [
    "map",
    "--input",
    "data/planets.csv",
    "--mapping",
    "planet.json5",
    "--type",
    "csv",
    "--output",
    "out",
    "--context",
    "local",
    "--context-file",
    "exoplanet-context.jsonld",
]

[[datasets]]
file = "data/planets.csv"
url = "https://exoplanetarchive.ipac.caltech.edu/TAP/sync"
source = "NASA Exoplanet Archive"
# A publicly funded NASA service with open access and no stated licence; published work is
# asked to carry the archive's acknowledgement text.
# https://exoplanetarchive.ipac.caltech.edu/docs/acknowledge.html
license = "Free reuse with acknowledgement (NASA Exoplanet Archive)"
volatility = "live"
command = '''
curl -sS --fail --retry 3 --retry-delay 5 --retry-all-errors -G "https://exoplanetarchive.ipac.caltech.edu/TAP/sync" \
    --data-urlencode "query=select pl_name,hostname,discoverymethod,disc_year,pl_orbper,pl_rade,pl_bmasse,pl_eqt,pl_orbeccen,st_teff,st_rad,st_mass,st_spectype,sy_pnum,sy_dist,ra,dec from ps where default_flag=1" \
    --data-urlencode "format=csv" \
    -o data/planets.csv
'''

[[outputs]]
file = "out/ExoPlanet.jsonld"
at-least = 3180

[[outputs]]
file = "out/Star.jsonld"
at-least = 2384
